<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>車隊成員名冊</title><style>
:root{color-scheme:dark;--bg:#090909;--panel:#171717;--muted:#a9a7a2;--accent:#efc34e;--line:#383329}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#33270b 0,transparent 55%),var(--bg);color:#faf8f1;font:16px/1.5 system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px 40px}.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#272015,#111111);border:1px solid #625027;border-radius:22px;padding:28px 22px 22px}.hero:after{content:"";position:absolute;right:-45px;top:-55px;width:170px;height:200px;transform:rotate(35deg);background:repeating-conic-gradient(#fff0 0% 25%,#ffffff0d 0% 50%) 0 0/32px 32px;pointer-events:none}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.18em;font-weight:800}h1{margin:8px 0 4px;font-size:clamp(28px,7vw,44px);line-height:1.2}p{margin:0;color:var(--muted)}.stats{display:flex;gap:24px;border-top:1px solid #ffffff25;margin-top:20px;padding-top:16px}.stats b{display:block;font-size:24px}.stats span,small{color:var(--muted);font-size:12px}.toolbar{margin:24px 0 14px;display:grid;gap:10px}input,select{width:100%;background:var(--panel);border:1px solid var(--line);padding:13px;border-radius:11px;color:inherit;font:inherit}input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#list{display:grid;gap:10px}.member{display:flex;align-items:center;gap:13px;padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:15px}.avatar{flex:0 0 44px;height:44px;display:grid;place-items:center;background:#332914;border-radius:12px;color:var(--accent);font-weight:800}.info{flex:1;min-width:0}.name{font-weight:750;overflow-wrap:anywhere}.role{color:var(--accent);font-size:12px;margin-left:7px;white-space:nowrap}.lineid{font-size:14px;color:var(--muted);overflow-wrap:anywhere}button{background:var(--accent);color:#17130a;border:0;border-radius:9px;padding:10px 12px;font:700 13px system-ui;cursor:pointer;white-space:nowrap}button:active{opacity:.7}footer{color:var(--muted);text-align:center;font-size:12px;margin-top:26px}.empty{text-align:center;padding:25px}.notice{margin-top:12px;font-size:12px;color:var(--muted)}@media(min-width:540px){.toolbar{grid-template-columns:1fr 155px}}@media(max-width:360px){.member{gap:8px;padding:12px}.avatar{display:none}} 
body {
    min-height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)),
        url('ea278803bb5ad1c6114d418bacd22b19.gif') center center / cover no-repeat fixed;
}

.hero {
    background: rgba(15,15,15,0.75);
    backdrop-filter: blur(8px);
}

.member {
    background: rgba(20,20,20,0.75);
    backdrop-filter: blur(8px);
}</style></head><body><main><header class="hero"><div class="eyebrow">KARTRIDER RUSH+ / TEAM DIRECTORY</div><h1 id="team"></h1><p>車隊成員名冊 · 遊戲與 LINE 聯絡資訊</p><div class="stats"><div><span>成員人數</span><b id="total"></b></div><div><span>名冊版本</span><b id="version"></b></div></div></header><p class="notice" id="notice"></p><div class="toolbar"><input id="search" type="search" placeholder="搜尋遊戲 ID、LINE ID 或暱稱" aria-label="搜尋成員"><select id="role" aria-label="成員分類"><option value="">全部成員</option></select></div><p id="count" role="status" style="font-size:13px;margin:0 0 10px"></p><section id="list" aria-label="成員名單"></section><footer>車隊專屬名冊 · 請勿轉傳他人聯絡資料</footer></main><script>
// 在此修改車隊名稱及名單。請先取得本人同意，再填入真實 LINE ID。
const teamName='ᴷᴾ台灣民眾黨 🌱';
const isDemo=false;
const members=[
 {game:'ᴷᴾღ柯文哲',line:'展穎',nick:'',role:'隊長'},
 {game:'ᴷᴾღ心平氣和',line:'俊',nick:'',role:'隊員'},
 {game:'ᴷᴾღ氣壓喇叭',line:'宇',nick:'',role:'隊員'},
 {game:'ᴷᴾღ純抱睡',line:'映萱',nick:'',role:'隊員'},
 {game:'ᴷᴾღ香菇',line:'黃楚耘',nick:'',role:'隊員'},
 {game:'cookie',line:'彭士華',nick:'',role:'隊員'}
];
const $=id=>document.getElementById(id);$('team').textContent=teamName;document.title=teamName+'｜成員名冊';$('total').textContent=members.length;$('version').textContent=isDemo?'DEMO':'LIVE';$('notice').textContent=isDemo?'測試名冊 · 請確認成員資料後再正式發布。':'本名冊為公開網頁，請勿擅自轉傳聯絡資料。';for(const r of new Set(members.map(m=>m.role))){const o=document.createElement('option');o.value=r;o.textContent=r;$('role').append(o)}
function el(tag,cls,t){const e=document.createElement(tag);e.className=cls;e.textContent=t;return e}async function copy(t,b){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t)}else{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();const ok=document.execCommand('copy');a.remove();if(!ok)throw Error('copy failed')}b.textContent='已複製';setTimeout(()=>b.textContent='複製 LINE',1300)}catch{b.textContent='請手動複製'}}
function render(){const q=$('search').value.trim().toLowerCase(),r=$('role').value;const found=members.filter(m=>(!r||m.role===r)&&[m.game,m.line,m.nick,m.role].some(v=>String(v||'').toLowerCase().includes(q)));$('count').textContent=`顯示 ${found.length} / ${members.length} 位成員`;$('list').replaceChildren();for(const m of found){const card=el('article','member',''),avatar=el('div','avatar',Array.from(m.game)[0]||'R'),info=el('div','info',''),name=el('div','name',m.game);name.append(el('span','role',m.role));info.append(name,el('div','lineid','LINE ID：'+(m.line||'未公開')));if(m.nick)info.append(el('small','','群組暱稱：'+m.nick));card.append(avatar,info);if(m.line){const b=el('button','','複製 LINE');b.type='button';b.onclick=()=>copy(m.line,b);card.append(b)}$('list').append(card)}if(!found.length)$('list').append(el('p','empty','沒有符合條件的成員。'))} $('search').addEventListener('input',render);$('role').addEventListener('change',render);render();</script></body></html>
