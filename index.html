<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ᴷᴾ台灣民眾黨 🌱｜成員名冊</title><style>
:root{color-scheme:dark;--bg:#090909;--panel:#171717;--muted:#a9a7a2;--accent:#efc34e;--line:#383329}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#33270b 0,transparent 55%),var(--bg);color:#faf8f1;font:16px/1.5 system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px 40px}.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#272015,#111111);border:1px solid #625027;border-radius:22px;padding:28px 22px 22px}.hero:after{content:"";position:absolute;right:-45px;top:-55px;width:170px;height:200px;transform:rotate(35deg);background:repeating-conic-gradient(#fff0 0% 25%,#ffffff0d 0% 50%) 0 0/32px 32px;pointer-events:none}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.18em;font-weight:800}h1{margin:8px 0 4px;font-size:clamp(28px,7vw,44px);line-height:1.2}p{margin:0;color:var(--muted)}.stats{display:flex;gap:24px;border-top:1px solid #ffffff25;margin-top:20px;padding-top:16px}.stats b{display:block;font-size:24px}.stats span,small{color:var(--muted);font-size:12px}.toolbar{margin:24px 0 14px;display:grid;gap:10px}input,select{width:100%;background:var(--panel);border:1px solid var(--line);padding:13px;border-radius:11px;color:inherit;font:inherit}input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#list{display:grid;gap:10px}.member{display:flex;align-items:center;gap:13px;padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:15px}.avatar{flex:0 0 44px;height:44px;display:grid;place-items:center;background:#332914;border-radius:12px;color:var(--accent);font-weight:800}.info{flex:1;min-width:0}.name{font-weight:750;overflow-wrap:anywhere}.role{color:var(--accent);font-size:12px;margin-left:7px;white-space:nowrap}.lineid{font-size:14px;color:var(--muted);overflow-wrap:anywhere}button{background:var(--accent);color:#17130a;border:0;border-radius:9px;padding:10px 12px;font:700 13px system-ui;cursor:pointer;white-space:nowrap}button:active{opacity:.7}footer{color:var(--muted);text-align:center;font-size:12px;margin-top:26px}.empty{text-align:center;padding:25px}.notice{margin-top:12px;font-size:12px;color:var(--muted)}@media(min-width:540px){.toolbar{grid-template-columns:1fr 155px}}@media(max-width:360px){.member{gap:8px;padding:12px}.avatar{display:none}} 
body {
    min-height: 100vh;
    background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)),
        url('ea278803bb5ad1c6114d418bacd22b19.gif') center center / cover no-repeat fixed #090909;
}
.hero { background: rgba(15,15,15,0.75); backdrop-filter: blur(8px); }
.member { background: rgba(20,20,20,0.75); backdrop-filter: blur(8px); }
@media(max-width:360px){.avatar{display:grid;flex-basis:34px;height:34px}}

.stats { display: none; }

[hidden]{display:none!important}.panel{background:rgba(15,15,15,.86);border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:16px;backdrop-filter:blur(8px)}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.secondary{background:#302b22;color:#f5e7c5;border:1px solid #625027}.danger{background:#682d30;color:white}button:disabled{opacity:.5;cursor:wait}label{display:block;margin:10px 0 4px;color:#e1ded7;font-size:14px}h2{font-size:19px;margin:0 0 8px}h3{font-size:16px;margin:12px 0 6px}.status{padding:8px 0;white-space:pre-wrap;overflow-wrap:anywhere;color:#f2d47d}.adminrow{padding:12px 0;border-bottom:1px solid var(--line)}.adminrow .actions{margin-top:8px}.check{display:flex;gap:8px;align-items:flex-start}.check input{width:auto;margin-top:5px}.role{display:inline-block;background:#332914;padding:1px 7px;border-radius:6px}button{max-width:100%} @media(prefers-reduced-motion:reduce){body{background:#090909}}
</style></head><body><main><header class="hero"><div class="eyebrow">KARTRIDER RUSH+ / TEAM DIRECTORY</div><h1>ᴷᴾ台灣民眾黨 🌱</h1><p>車隊成員名冊 · 遊戲與 LINE 聯絡資訊</p></header>
<p class="notice">本名冊為公開網頁，請勿擅自轉傳聯絡資料。</p>
<section class="panel"><div class="actions"><button id="login" disabled>Google 登入 / 成員登記</button><button id="logout" class="secondary" hidden>登出</button><span id="who"></span></div><p id="status" class="status" role="status">正在連線 Firebase…</p>
<form id="apply" hidden><h2>成員自主登記 / 更新資料</h2><p>提交後須經管理員審核。原有成員請填相同遊戲 ID，管理員可合併舊資料。</p><label for="game">遊戲 ID</label><input id="game" maxlength="80" required><label for="line">LINE ID 或顯示名稱</label><input id="line" maxlength="100" required><label for="nick">群組暱稱（選填）</label><input id="nick" maxlength="80"><label class="check"><input type="checkbox" id="consent" required>我同意審核通過後，以上資料公開於車隊網站。</label><button type="submit">送出審核</button><p id="own" class="status"></p></form></section>
<section id="admin" class="panel" hidden><h2>管理員後台</h2><div class="actions"><button id="seed" class="secondary">匯入原本六位成員（首次）</button><button id="new" class="secondary">新增正式成員</button></div><h3>待審核申請</h3><div id="pending"></div><h3>正式成員管理</h3><div id="manage"></div><form id="edit" hidden><h3 id="editTitle">編輯成員</h3><label for="eg">遊戲 ID</label><input id="eg" maxlength="80" required><label for="el">LINE ID / 顯示名稱</label><input id="el" maxlength="100" required><label for="en">群組暱稱</label><input id="en" maxlength="80"><label for="er">職位</label><input id="er" maxlength="40" required><div class="actions" style="margin-top:12px"><button type="submit">儲存</button><button type="button" id="cancel" class="secondary">取消</button></div></form></section>
<div class="toolbar"><input id="search" type="search" placeholder="搜尋遊戲 ID、LINE ID 或暱稱" aria-label="搜尋成員"><select id="role" aria-label="成員分類"><option value="">全部成員</option></select></div><p id="count" role="status" style="font-size:13px;margin:0 0 10px">讀取中…</p><section id="list" aria-label="成員名單"></section><footer>車隊專屬名冊 · 請勿轉傳他人聯絡資料</footer></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import {getFirestore,collection,doc,onSnapshot,setDoc,deleteDoc,addDoc,runTransaction,writeBatch,getDocsFromServer} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyBLggwp0WxbHR0tDmpQyG2Pj4K-fXDnAu8",authDomain:"kp-kart-team.firebaseapp.com",projectId:"kp-kart-team",storageBucket:"kp-kart-team.firebasestorage.app",messagingSenderId:"199590143681",appId:"1:199590143681:web:e1c62ea4938e5a0d049640"});
const auth=getAuth(app),db=getFirestore(app), mc=collection(db,'members'), ac=collection(db,'applications');
const original=[
 {game:'ᴷᴾღ柯文哲',line:'展穎',nick:'',role:'隊長'},
 {game:'ᴷᴾღ心平氣和',line:'俊',nick:'',role:'隊員'},
 {game:'ᴷᴾღ氣壓喇叭',line:'宇',nick:'',role:'隊員'},
 {game:'ᴷᴾღ純抱睡',line:'映萱',nick:'',role:'隊員'},
 {game:'ᴷᴾღ香菇',line:'黃楚耘',nick:'',role:'隊員'},
 {game:'cookie',line:'彭士華',nick:'',role:'隊員'},
];
const $=id=>document.getElementById(id);let members=[],user=null,admin=false,ready=false,stopOwn=null,stopApps=null,editId=null,authEpoch=0,busy=false;
function node(tag,text,cls=''){const e=document.createElement(tag);e.textContent=text;e.className=cls;return e}
function message(t){$('status').textContent=t}function fail(e){console.error(e);message('操作失敗：'+(e.code||e.message||'未知錯誤')+'，請確認登入及 Firebase 設定。')}
async function act(fn){if(busy)return;busy=true;try{await fn()}catch(e){fail(e)}finally{busy=false}}
function btn(t,fn,cls='secondary'){const b=node('button',t,cls);b.type='button';b.onclick=()=>act(fn);return b}
function fields(m){return [m.game,m.line,m.nick,m.role].filter(Boolean).join(' ｜ ')}
function render(){const selected=$('role').value;const roles=[...new Set(members.map(m=>m.role).filter(Boolean))];$('role').replaceChildren(new Option('全部成員',''),...roles.map(r=>new Option(r,r)));if(roles.includes(selected))$('role').value=selected;const q=$('search').value.trim().toLowerCase(),r=$('role').value;const found=members.filter(m=>(!r||m.role===r)&&fields(m).toLowerCase().includes(q));$('count').textContent=ready?`顯示 ${found.length} / ${members.length} 位成員`:'名冊尚未載入';$('list').replaceChildren();for(const m of found){const card=node('article','','member'),info=node('div','','info'),name=node('div',m.game,'name');if(m.role)name.append(node('span',m.role,'role'));info.append(name,node('div','LINE ID：'+(m.line||'未公開'),'lineid'));if(m.nick)info.append(node('small','群組暱稱：'+m.nick));card.append(node('div','ᴷᴾ','avatar'),info);if(m.line){let b=btn('複製 LINE',async()=>{try{await navigator.clipboard.writeText(m.line);b.textContent='已複製';setTimeout(()=>b.textContent='複製 LINE',1300)}catch{message('無法複製，請手動選取 LINE 資料。')}},'');card.append(b)}$('list').append(card)}if(ready&&!found.length)$('list').append(node('p','沒有符合條件的成員。','empty'));if(admin)renderManage()}
function renderManage(){ $('manage').replaceChildren();$('seed').disabled=!ready||members.length!==0;for(const m of members){const row=node('div','','adminrow'),a=node('div','','actions');row.append(node('div',fields(m)));a.append(btn('編輯',()=>openEdit(m)),btn('移除',async()=>{if(confirm('確定移除 '+m.game+'？')){await deleteDoc(doc(mc,m.id));message('已移除成員。')}},'danger'));row.append(a);$('manage').append(row)}}
function openEdit(m){editId=m?.id||null;$('eg').value=m?.game||'';$('el').value=m?.line||'';$('en').value=m?.nick||'';$('er').value=m?.role||'隊員';$('editTitle').textContent=m?'編輯成員':'新增成員';$('edit').hidden=false;$('edit').scrollIntoView({block:'nearest'})}
function input(id){return $(id).value.trim()}
$('search').oninput=render;$('role').onchange=render;
onSnapshot(mc,s=>{ready=true;members=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.role==='隊長'?0:1)-(b.role==='隊長'?0:1)||String(a.game).localeCompare(String(b.game),'zh-Hant'));render()},e=>{ready=false;fail(e)});
$('login').onclick=()=>act(async()=>{await signInWithPopup(auth,new GoogleAuthProvider())});$('logout').onclick=()=>act(async()=>{await signOut(auth)});
onAuthStateChanged(auth,async u=>{const epoch=++authEpoch;stopOwn?.();stopApps?.();stopOwn=stopApps=null;user=u;admin=false;$('admin').hidden=true;$('apply').hidden=true;$('edit').hidden=true;$('pending').replaceChildren();$('manage').replaceChildren();$('who').textContent='';$('own').textContent='';$('apply').reset();$('login').hidden=!!u;$('login').disabled=false;$('logout').hidden=!u;if(!u){message('訪客模式：可查看名冊，登入後可登記。');return}try{const token=await u.getIdTokenResult();if(epoch!==authEpoch)return;admin=token.claims.email==='a0976710818@gmail.com'&&token.claims.email_verified===true&&token.signInProvider==='google.com';$('who').textContent=admin?'最高管理員':'已登入';$('apply').hidden=false;$('admin').hidden=!admin;message(admin?'管理員登入成功。':'登入成功，可提交個人資料。');const existing=members.find(m=>m.id===u.uid);if(existing){$('game').value=existing.game;$('line').value=existing.line;$('nick').value=existing.nick||''}stopOwn=onSnapshot(doc(ac,u.uid),s=>{$('own').textContent=s.exists()?'已有待審核資料，可再次提交更新。':'目前沒有待審核申請。';if(s.exists()&&!$('game').value){const m=s.data();$('game').value=m.game;$('line').value=m.line;$('nick').value=m.nick}},fail);if(admin){renderManage();stopApps=onSnapshot(ac,s=>renderPending(s.docs),fail)}}catch(e){fail(e)}});
$('apply').onsubmit=e=>{e.preventDefault();act(async()=>{if(!user||!$('consent').checked)return;const data={game:input('game'),line:input('line'),nick:input('nick')};if(!data.game||!data.line)throw Error('請填寫完整資料');await setDoc(doc(ac,user.uid),data);message('已提交，等待管理員審核。')})};
function renderPending(docs){$('pending').replaceChildren();if(!docs.length)$('pending').append(node('p','目前沒有待審核申請。'));for(const d of docs){const m=d.data(),row=node('div','','adminrow'),a=node('div','','actions');row.append(node('div',fields(m)));const select=document.createElement('select');select.setAttribute('aria-label','合併舊成員');select.append(new Option('新增或更新此登入帳號的名冊',''));for(const old of members.filter(x=>x.id!==d.id))select.append(new Option('合併舊成員：'+old.game,old.id));row.append(select);a.append(btn('核准',async()=>{const merge=select.value;if(!confirm(merge?'核准並合併選取的舊成員？':'核准此申請並公開資料？'))return;await runTransaction(db,async tx=>{const ar=doc(ac,d.id),mr=doc(mc,d.id),as=await tx.get(ar),ms=await tx.get(mr);const oldRef=merge?doc(mc,merge):null,os=oldRef?await tx.get(oldRef):null;if(!as.exists())throw Error('申請已處理');const latest=as.data();if(latest.game!==m.game||latest.line!==m.line||latest.nick!==m.nick)throw Error('申請已更新，請重新確認');if(oldRef&&!os.exists())throw Error('舊成員不存在');if(oldRef&&ms.exists())throw Error('此帳號已有正式資料，請勿合併');tx.set(mr,{game:latest.game,line:latest.line,nick:latest.nick,role:ms.exists()?ms.data().role:os?.exists()?os.data().role:'隊員'});if(oldRef)tx.delete(oldRef);tx.delete(ar)});message('已核准並公開。')},''),btn('拒絕',async()=>{if(confirm('確定拒絕此申請？')){await deleteDoc(doc(ac,d.id));message('已拒絕申請。')}},'danger'));row.append(a);$('pending').append(row)}}
$('new').onclick=()=>openEdit(null);$('cancel').onclick=()=>{$('edit').hidden=true};$('edit').onsubmit=e=>{e.preventDefault();act(async()=>{const m={game:input('eg'),line:input('el'),nick:input('en'),role:input('er')};if(!m.game||!m.line||!m.role)throw Error('必填欄位不可留白');if(editId)await setDoc(doc(mc,editId),m);else await addDoc(mc,m);$('edit').hidden=true;message('已儲存正式成員。')})};
$('seed').onclick=()=>act(async()=>{if(!confirm('確認原有六位成員已同意公開，並匯入空白資料庫？'))return;const snap=await getDocsFromServer(mc);if(!snap.empty)throw Error('名冊已有資料，不可重複匯入');const b=writeBatch(db);original.forEach((m,i)=>b.set(doc(mc,'legacy-'+(i+1)),m));await b.commit();message('六位成員匯入完成。')});
</script></body></html>
