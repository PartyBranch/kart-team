rage.setItem('kp4demo_'+k,JSON.stringify(v));return true}catch{return false}}function ranked(t=track){return racers.map((r,i)=>({...r,t:times[t][i],i})).sort((a,b)=>a.t-b.t)}function navRender(){for(const n of ['sideNav','bottomNav'])document.getElementById(n).innerHTML=nav.map(([k,l])=>`<button data-page="${k}" class="${page===k?'active':''}" ${page===k?'aria-current="page"':''}>${ic(k)}${l}</button>`).join('')}function go(p){page=p;query='';render();window.scrollTo({top:0,behavior:'instant'})}const heading=(en,zh,action='')=>`<div class="heading"><div><span class="eyebrow">${en}</span><h2>${zh}</h2></div>${action}</div>`;const link=(p,t)=>`<button class="link" data-page="${p}">${t} →</button>`;const news=[['置頂','11/26','本週計時挑戰賽開放報名','本週指定賽道：城鎮高速公路。歡迎隊員提交最佳成績。'],['更新','11/25','車隊網站 V4.0 概念版','全新車手名片、歷史紀錄與賽事中心。'],['一般','11/23','成績投稿規則','請填寫正確的遊戲 ID、車種及完賽時間，等待管理員審核。']];function newsHtml(all=false){return news.slice(0,all?3:2).map(([tag,d,t,b])=>`<article class="news"><span class="pill">${tag}</span> <small class="muted">${d}</small><h4>${t}</h4><p>${b}</p></article>`).join('')}function podium(t=track){let r=ranked(t);return `<div class="podium">${[1,0,2].map(i=>`<div class="pod ${i===0?'first':i===2?'third':''}"><div class="medal">${['🥇','🥈','🥉'][i]}</div>${av(r[i])}<div class="name">${r[i].n}</div><div class="time">${fmt(r[i].t)}</div><div class="base">${i+1}</div></div>`).join('')}</div>`}function hero(){return `<section class="hero"><svg class="hero-art" viewBox="0 0 440 310" fill="none" aria-hidden="true"><defs><linearGradient id="track" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1bb"/><stop offset="1" stop-color="#8a6735"/></linearGradient><pattern id="checks" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="11" height="11" fill="#eac477"/><rect x="11" y="11" width="11" height="11" fill="#eac477"/></pattern></defs><path d="M50 350 200 155Q238 111 298 120L337 125Q380 132 390 97Q398 64 350 56L288 47Q241 42 214 15L170-30" stroke="#eac477" stroke-opacity=".2" stroke-width="79"/><path d="M50 350 200 155Q238 111 298 120L337 125Q380 132 390 97Q398 64 350 56L288 47Q241 42 214 15L170-30" stroke="#101316" stroke-width="62"/><path d="M50 350 200 155Q238 111 298 120L337 125Q380 132 390 97Q398 64 350 56L288 47Q241 42 214 15L170-30" stroke="url(#track)" stroke-width="2" stroke-dasharray="13 12"/><g transform="translate(188 158) rotate(37)"><rect x="-30" y="-10" width="60" height="20" fill="url(#checks)" opacity=".85"/></g><g transform="translate(145 226) rotate(36)"><rect x="-17" y="-35" width="34" height="69" rx="13" fill="#cba75e"/><rect x="-10" y="-13" width="20" height="24" rx="5" fill="#131719"/><rect x="-23" y="-21" width="9" height="19" rx="3" fill="#08090a"/><rect x="14" y="-21" width="9" height="19" rx="3" fill="#08090a"/><rect x="-23" y="13" width="9" height="20" rx="3" fill="#08090a"/><rect x="14" y="13" width="9" height="20" rx="3" fill="#08090a"/><path d="M-5-34v15m10-15v15" stroke="#fff1c0" stroke-width="2"/></g></svg><div class="hero-content"><div class="eyebrow">KARTRIDER RUSH+ / SEASON 01</div><h1>速度決定一切。<br><span style="color:var(--gold)">ᴷᴾ台灣民眾黨 🌱</span></h1><p>車隊交流・競速紀錄・榮譽共享</p><div class="actions"><button class="primary" data-act="submit">${ic('plus')} 提交成績</button><button class="secondary" data-page="trophy">查看排行 ${ic('arrow')}</button></div></div></section>`}function home(){return hero()+`<div class="stats">${[['users','車隊成員','6'],['flag','指定賽道','3'],['trophy','正式紀錄','18']].map(([i,l,n])=>`<div class="stat">${ic(i)}<small>${l}</small><strong>${n}</strong></div>`).join('')}</div>${heading('RACE CENTER','競速焦點',link('trophy','完整排名'))}<div class="homegrid"><section class="panel"><div class="panel-title"><h3>城鎮高速公路</h3><span class="pill">本週熱門</span></div>${podium(0)}</section><section class="panel"><div class="panel-title"><h3>最新公告</h3>${link('news','全部')}</div>${newsHtml()}</section></div>${heading('LIVE FEED','近期戰績')}<section class="panel">${ranked(0).slice(0,3).map((r,i)=>`<div class="activity">${av(r)}<div class="desc"><b>${r.n} ${i===0?'刷新車隊紀錄':'提交最佳成績'}</b><small>城鎮高速公路 · ${['今天','昨天','11/25'][i]}</small></div><span class="time">${fmt(r.t)}</span></div>`).join('')}</section>`}function ranking(){const rs=ranked();return `${heading('LEADERBOARD','賽道排行榜','<button class="primary" data-act="submit">'+ic('plus')+' 投稿</button>')}<div class="trackbar">${tracks.map((t,i)=>`<button class="${track===i?'active':''}" data-track="${i}">${t}</button>`).join('')}</div><section class="panel"><div class="panel-title"><h3>${tracks[track]} · 榮譽頒獎台</h3><span class="pill">SEASON 01</span></div>${podium()}</section>${heading('ALL DRIVERS','完整排名')}<section class="panel"><div class="rankhead"><span>名次</span><span>車手</span><span>最佳成績</span><span>變動</span></div>${rs.map((r,i)=>`<div class="rankrow"><div class="rank">${['🥇','🥈','🥉'][i]||i+1}</div><div class="driver" data-driver="${r.i}" style="cursor:pointer">${av(r)}<div><b>${r.n}</b>${i<3?`<small>${r.car} · ${r.note}</small>`:''}</div></div><span class="time">${fmt(r.t)}</span><span class="${i%3===2?'down':'up'}">${['↑ 2','—','↓ 1'][i%3]}</span></div>`).join('')}</section><p class="hint">前 3 名顯示車種與備註；點擊車手查看個人戰績。排名變動為示意。</p>${get('submissions').length?`<section class="panel"><h3>本機待審核投稿</h3>${get('submissions').map(s=>`<div class="news">${esc(s.id)} · ${esc(s.track)} · ${esc(s.time)} <span class="pill">待審核</span></div>`).join('')}</section>`:''}`}
function members(){return `${heading('TEAM ROSTER','車手名冊','<button class="primary" data-act="join">'+ic('plus')+' 登記</button>')}<input class="search" id="search" placeholder="搜尋暱稱或遊戲 ID" value="${esc(query)}" aria-label="搜尋車手"><div style="height:12px"></div><div class="members" id="members">${memberCards()}</div>`}function memberCards(){let a=racers.map((r,i)=>({...r,i})).filter(r=>(r.n+' '+r.id).toLowerCase().includes(query.toLowerCase()));return a.length?a.map(r=>`<button class="panel member" data-driver="${r.i}">${av(r)}<h3>${r.n}</h3><span class="pill">${r.r}</span><small class="muted">${r.id}</small><span class="time">${fmt(Math.min(...times.map(t=>t[r.i])))}</span><small class="muted">個人名片 →</small></button>`).join(''):'<p class="muted">找不到符合的車手。</p>'}function events(){let registered=get('events');return `${heading('RACE EVENTS','車隊賽事')}<section class="panel event"><div class="date">DEC<strong>05</strong></div><div class="info"><span class="pill">報名中</span><h3>冬季計時挑戰賽</h3><p>12/05 · 城鎮高速公路</p></div><button class="${registered.includes(0)?'secondary':'primary'}" data-event="0">${registered.includes(0)?'取消報名':'立即報名'}</button></section><section class="panel event"><div class="date">DEC<strong>12</strong></div><div class="info"><span class="pill">報名中</span><h3>森林髮夾彎挑戰</h3><p>12/12 · 個人計時賽</p></div><button class="${registered.includes(1)?'secondary':'primary'}" data-event="1">${registered.includes(1)?'取消報名':'立即報名'}</button></section><p class="hint">報名狀態只保留在目前瀏覽器，不會通知正式車隊。</p>`}function render(){navRender();document.getElementById('pageTitle').textContent=nav.find(n=>n[0]===page)[2];let v=document.getElementById('view');v.innerHTML=page==='home'?home():page==='trophy'?ranking():page==='users'?members():page==='news'?heading('TEAM NOTICE','車隊公告')+`<section class="panel">${newsHtml(true)}</section>`:events();v.classList.remove('view');void v.offsetWidth;v.classList.add('view')}
const modal=document.getElementById('modal');function openModal(body){modal.innerHTML='<button class="close" data-act="close" aria-label="關閉">×</button>'+body;if(!modal.open)modal.showModal()}function showDriver(i){let r=racers[i],t=times[track][i],rank=ranked().findIndex(x=>x.i===i)+1;let series=[t+584,t+390,t+245,t+103,t];openModal(`<div style="display:flex;align-items:center;gap:12px">${av(r)}<div><h2 style="margin:0">${r.n}</h2><small class="muted">${r.r} · ${r.id}</small></div></div><div class="stats"><div class="stat"><small>本賽道排名</small><strong>#${rank}</strong></div><div class="stat"><small>最佳成績</small><strong style="font-size:19px;color:var(--gold)">${fmt(t)}</strong></div><div class="stat"><small>累計進步</small><strong style="font-size:19px;color:var(--green)">5.84s</strong></div></div><h3>${tracks[track]} · 歷史戰績</h3><svg class="chart" viewBox="0 0 320 136" role="img" aria-label="示意戰績逐步進步">${[18,45,72,99].map(y=>`<path d="M12 ${y}H307" stroke="#ffffff17" stroke-dasharray="3 4"/>`).join('')}<path d="M20 15 L90 44 L160 66 L230 91 L300 109 L300 120H20Z" fill="#eac47715"/><path d="M20 15 L90 44 L160 66 L230 91 L300 109" fill="none" stroke="#eac477" stroke-width="2.5"/>${series.map((s,j)=>`<circle cx="${20+j*70}" cy="${[15,44,66,91,109][j]}" r="4" fill="#eac477"/><text x="${20+j*70}" y="133" text-anchor="middle" fill="#92979e" font-size="9">${fmt(s)}</text>`).join('')}</svg><h3>車手成就</h3><span class="pill">⚑ 賽道挑戰者</span> ${rank===1?'<span class="pill">♛ 車隊之王</span>':''}<p class="hint">個人歷史及成就為示範資料。</p>`)}function openForm(kind){let join=kind==='join';openModal(`<h2>${join?'隊員資料登記':'提交賽道成績'}</h2><p class="hint">請填入對應 ID。Demo 只儲存於本機。</p><form id="demoForm" data-kind="${kind}"><label>遊戲 ID<input name="id" required maxlength="40" placeholder="請填入對應 ID"></label>${join?'<label>遊戲暱稱<input name="name" required maxlength="30"></label>':`<label>賽道<select name="track">${tracks.map((t,i)=>`<option ${i===track?'selected':''}>${t}</option>`).join('')}</select></label><label>成績（分:秒.百分秒）<input name="time" required pattern="[0-9]{1,2}:[0-5][0-9]\\.[0-9]{2}" placeholder="1:32.58"></label><label>使用車種<input name="car" required maxlength="40"></label><label>備註<textarea name="note" rows="2" maxlength="150"></textarea></label>`}<button class="primary" type="submit" style="width:100%">送出 · 等待審核</button></form>`)}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2600)}document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-track],[data-driver],[data-act],[data-event]');if(!b)return;if(b.dataset.page)go(b.dataset.page);else if(b.dataset.track!==undefined){track=Number(b.dataset.track);render()}else if(b.dataset.driver!==undefined)showDriver(Number(b.dataset.driver));else if(b.dataset.act==='close')modal.close();else if(b.dataset.act)openForm(b.dataset.act);else if(b.dataset.event!==undefined){let k=Number(b.dataset.event),a=get('events'),on=a.includes(k);if(save('events',on?a.filter(x=>x!==k):[...a,k])){render();toast(on?'已取消本機報名':'本機報名成功')}else toast('瀏覽器禁止本機儲存')}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.getElementById('members').innerHTML=memberCards()}});document.addEventListener('submit',e=>{if(e.target.getAttribute('id')!=='demoForm')return;e.preventDefault();let key=e.target.dataset.kind==='join'?'joins':'submissions',data=Object.fromEntries(new FormData(e.target));if(save(key,[...get(key),data])){modal.close();render();toast('已儲存本機投稿 · 待審核')}else toast('瀏覽器禁止本機儲存')});render();</script></body></html>
